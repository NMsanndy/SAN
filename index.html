<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book Your DJ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff00ff, #ff6600);
            color: white;
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
        .btn-book {
            background: #ffcc00;
            color: yellow;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">🎵 Book Your DJ Now 🎧</h2>
        <form asp-action="Create" method="post">
            <div class="mb-3">
                <label>Name:</label>
                <input asp-for="Name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email:</label>
                <input asp-for="Email" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Mobile:</label>
                <input asp-for="Mobile" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Event Date:</label>
                <input asp-for="EventDate" type="date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Start Time:</label>
                <input asp-for="StartTime" type="time" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>End Time:</label>
                <input asp-for="EndTime" type="time" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Event Type:</label>
                <input asp-for="EventType" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Venue Address:</label>
                <input asp-for="Venue" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Additional Info:</label>
                <textarea asp-for="AdditionalInfo" class="form-control"></textarea>
            </div>
            <button type="submit" class="btn btn-book w-100">Book Now</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Booking Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>DJ Booking Form</h2>
        <form id="bookingForm">
            <label>Date:</label>
            <input type="date" id="date" required>
            
            <label>Time:</label>
            <input type="time" id="time" required>
            
            <label>Desired Music:</label>
            <textarea id="music" required></textarea>
            
            <label>Budget:</label>
            <input type="number" id="budget" required>
            
            <label>Name:</label>
            <input type="text" id="name" required>
            
            <label>Email:</label>
            <input type="email" id="email" required>
            
            <label>Phone:</label>
            <input type="tel" id="phone" required>
            
            <button type="submit">Book Now</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
